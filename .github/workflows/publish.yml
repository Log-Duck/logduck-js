# Publishes the package to npmjs.com over OIDC trusted publishing — no token.
#
#   npm version minor && git push --follow-tags
#
# The npmjs.com side must name this repository AND this workflow file as a
# trusted publisher, or the publish step fails with an authentication error.
# That pairing is the whole credential.
#
# `npm version` writes package.json and creates the matching tag in one step,
# so the two cannot disagree. The job checks anyway: a hand-made tag is the
# case worth catching, and an npm version can never be replaced once published.
name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Named on the npm side too, where it narrows the trusted publisher further:
    # the OIDC token has to come from a job running in *this* environment, not
    # merely from this workflow. It is also the only place a human gate can be
    # attached to an npm version, which can never be replaced once live —
    # required reviewers and a tags-only ref rule are configured in the
    # repository's environment settings, not here.
    #
    # If npm names an environment and this line is missing or spelled
    # differently, the claim will not match and every publish fails.
    environment: release

    permissions:
      contents: read
      # This is the credential. npm trusts a short-lived OIDC token minted for
      # this specific repository and workflow file, so there is no long-lived
      # secret to expire — which is exactly how v2.0.0 was lost: NPM_TOKEN was
      # set, npm rejected it, and npm answers an unauthorised PUT with a 404
      # that reads like a missing package. It also signs the provenance.
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org

      # Node 22 ships npm 10, which predates trusted publishing and would fall
      # back to looking for a token that no longer exists. Pinned to a floor
      # rather than @latest so a future npm cannot change the publish path
      # under us without this line changing first.
      - name: Use an npm that can authenticate over OIDC
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Resolve and check the version
        id: version
        run: |
          pkg=$(node -p "require('./package.json').version")

          # A manual run has no tag to check against, so package.json stands alone.
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME#v}"
            if [[ "$tag" != "$pkg" ]]; then
              echo "::error::Tag says $tag but package.json says $pkg."
              exit 1
            fi
          fi

          echo "Publishing version $pkg"
          echo "value=$pkg" >> "$GITHUB_OUTPUT"

      # npm answers a duplicate publish with a 403 that reads like an auth
      # failure, which sends you looking in the wrong place. Ask up front.
      - name: Refuse to republish an existing version
        run: |
          v="${{ steps.version.outputs.value }}"
          if npm view "logduck@$v" version >/dev/null 2>&1; then
            echo "::error::logduck@$v is already on npm. Versions there are immutable — bump and re-tag."
            exit 1
          fi
          echo "Version $v is free."

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # `npm publish` runs prepublishOnly, which builds. Publishing the built
      # dist without that would risk shipping a stale one from the cache.
      #
      # No token, and no NODE_AUTH_TOKEN: npm authenticates from the OIDC token
      # granted by `id-token: write` above. This requires the package to name
      # this repository and this workflow file as a trusted publisher in its
      # npmjs.com settings — that pairing is the credential, so a fork or a
      # different workflow in this same repo cannot publish.
      #
      # `--provenance` is kept explicit. Trusted publishing is documented as
      # generating it anyway, and if a future npm rejects the combination the
      # run fails loudly rather than quietly shipping without attestation.
      - name: Publish
        run: npm publish --provenance --access public
